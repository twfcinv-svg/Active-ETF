<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>00981A 主動統一台股增長 - 專業決策儀表板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        .num-font { font-family: 'Din Alternate', 'SF Pro Display', sans-serif; font-variant-numeric: tabular-nums; }
        /* 自訂漸層背景 */
        .bg-corporate-gradient { background: linear-gradient(135deg, #0f766e 0%, #0369a1 100%); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <div class="bg-corporate-gradient text-white pb-16 pt-6 px-6 shadow-lg">
        <div class="max-w-7xl mx-auto">
            <div class="flex justify-between items-end mb-8 border-b border-teal-600/50 pb-4">
                <div>
                    <div class="text-teal-200 text-sm font-semibold tracking-wider mb-1" id="etfTitle">主動統一台股增長</div>
                    <h1 class="text-3xl font-bold tracking-wider flex items-center">
                        <select id="etfSelector" class="bg-transparent border-b-2 border-white/30 focus:outline-none focus:border-white cursor-pointer pb-1 appearance-none pr-4 text-white">
                            <option value="" disabled selected>載入中...</option>
                        </select>
                        <span class="text-lg font-normal ml-2 opacity-80" id="dateDisplay">--/-- 操作日報</span>
                        
                        <select id="timeSelector" class="ml-4 bg-transparent border-b border-white/30 text-sm font-normal opacity-90 focus:outline-none focus:border-white cursor-pointer pb-1 appearance-none text-white">
                            <option value="1" class="text-slate-800">1天變化 (與昨比)</option>
                            <option value="2" class="text-slate-800">3天變化 (期間累計)</option>
                        </select>
                    </h1>
                </div>
                <div class="flex gap-6 text-right">
                    <div>
                        <div class="text-teal-200 text-xs mb-1">基金規模 (億)</div>
                        <div class="text-2xl font-bold num-font">2,619.1 <span class="text-sm text-red-300 ml-1">+0.06%</span></div>
                    </div>
                    <div class="w-px bg-teal-600/50"></div>
                    <div>
                        <div class="text-teal-200 text-xs mb-1">目前折溢價</div>
                        <div class="text-2xl font-bold num-font text-red-300">+0.17%</div>
                    </div>
                </div>
            </div>
            
            <div class="flex gap-8 text-sm">
                <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-amber-400"></div>新增 <span id="countNew" class="font-bold">0</span> 檔</div>
                <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-red-400"></div>加碼 <span id="countAdd" class="font-bold">0</span> 檔</div>
                <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-green-400"></div>減碼 <span id="countReduce" class="font-bold">0</span> 檔</div>
                <div class="flex items-center gap-2 opacity-50"><div class="w-3 h-3 rounded-full bg-slate-400"></div>刪除 <span id="countDelete" class="font-bold">0</span> 檔</div>
            </div>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-6 -mt-10 pb-12">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

            <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
                <div class="bg-slate-50 border-b border-slate-200 px-6 py-4">
                    <h2 class="text-lg font-bold text-slate-800 border-l-4 border-red-500 pl-3">資金流入 (新增 / 加碼)</h2>
                </div>
                
                <div class="p-6 space-y-4" id="inflowList">
                    </div>
            </div>

            <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden flex flex-col">
                <div class="bg-slate-50 border-b border-slate-200 px-6 py-4">
                    <h2 class="text-lg font-bold text-slate-800 border-l-4 border-green-500 pl-3">資金流出 (刪除 / 減碼)</h2>
                </div>
                
                <div class="p-6 space-y-4 flex-grow" id="outflowList">
                    </div>
            </div>

        </div>
    </main>

    <script>
        let globalData = []; // 儲存全域資料供切換時使用

        async function initDashboard() {
            try {
                const response = await fetch('data.csv');
                const csvData = await response.text();
                const rows = csvData.split('\n').filter(row => row.trim() !== '').slice(1);
                
                globalData = rows.map(row => {
                    const cols = row.split(',');
                    return {
                        date: cols[0],
                        etfId: cols[1],
                        etfName: cols[2],
                        stockId: cols[3],
                        stockName: cols[4],
                        amount: parseInt(cols[6]),
                        weight: parseFloat(cols[8])
                    };
                });

                const etfMap = [...new Set(globalData.map(d => `${d.etfId}|${d.etfName}`))];
                const selector = document.getElementById('etfSelector');
                selector.innerHTML = ''; 
                
                etfMap.forEach(etfStr => {
                    const [id, name] = etfStr.split('|');
                    const opt = document.createElement('option');
                    opt.value = id;
                    opt.textContent = id;
                    opt.className = "text-slate-800"; 
                    selector.appendChild(opt);
                });

                // 綁定 ETF 切換與天數切換事件
                selector.addEventListener('change', () => renderEtfData());
                document.getElementById('timeSelector').addEventListener('change', () => renderEtfData());
                
                renderEtfData(); // 初次渲染

            } catch (error) {
                console.error("資料讀取失敗:", error);
                document.getElementById('etfTitle').textContent = "請確認資料來源";
            }
        }

        function renderEtfData() {
            const selectedEtfId = document.getElementById('etfSelector').value;
            const lookbackDays = parseInt(document.getElementById('timeSelector').value); // 取得選取的天數
            
            const etfData = globalData.filter(d => d.etfId === selectedEtfId);
            const dates = [...new Set(etfData.map(d => d.date))].sort();
            
            if(dates.length === 0) return;

            const today = dates[dates.length - 1];
            
            // 計算比較的日期，如果選擇 3天(lookback=2)，但資料不夠，就抓最舊的那天(index=0)
            let compareIndex = dates.length - 1 - lookbackDays;
            if (compareIndex < 0) compareIndex = 0; 
            const compareDate = dates[compareIndex];

            const todayStocks = etfData.filter(d => d.date === today);
            const compareStocks = etfData.filter(d => d.date === compareDate);

            const formattedDate = `${today.substring(4,6)}/${today.substring(6,8)}`;
            document.getElementById('etfTitle').textContent = todayStocks[0].etfName;
            document.getElementById('dateDisplay').textContent = `${formattedDate} 操作日報`;

            const inflowList = document.getElementById('inflowList');
            const outflowList = document.getElementById('outflowList');
            inflowList.innerHTML = '';
            outflowList.innerHTML = '';

            let counts = { 'NEW': 0, 'ADD': 0, 'REDUCE': 0, 'DELETE': 0 };

            // 以最新一天為基準，比對過去
            todayStocks.forEach(stock => {
                const prevVersion = compareStocks.find(s => s.stockId === stock.stockId);
                let status = '';
                let diffAmount = 0;
                let diffWeight = 0;
                let diffPercent = 0;

                if (!prevVersion) {
                    status = 'NEW';
                    diffAmount = stock.amount;
                    diffWeight = stock.weight;
                    diffPercent = 100;
                } else {
                    diffAmount = stock.amount - prevVersion.amount;
                    diffWeight = stock.weight - prevVersion.weight;
                    if (diffAmount > 0) {
                        status = 'ADD';
                        diffPercent = (diffAmount / prevVersion.amount) * 100;
                    } else if (diffAmount < 0) {
                        status = 'REDUCE';
                        diffPercent = (Math.abs(diffAmount) / prevVersion.amount) * -100;
                    }
                }

                if (status) {
                    counts[status]++;
                    const card = createCardHTML(stock, status, diffAmount, diffPercent, stock.weight, diffWeight);
                    if (status === 'NEW' || status === 'ADD') inflowList.insertAdjacentHTML('beforeend', card);
                    else outflowList.insertAdjacentHTML('beforeend', card);
                }
            });

            // 檢查過去有，但今天不見的標的 (刪除)
            compareStocks.forEach(stock => {
                const todayVersion = todayStocks.find(s => s.stockId === stock.stockId);
                if (!todayVersion) {
                    counts['DELETE']++;
                    const card = createCardHTML(stock, 'DELETE', -stock.amount, -100, 0, -stock.weight);
                    outflowList.insertAdjacentHTML('beforeend', card);
                }
            });

            document.getElementById('countNew').textContent = counts['NEW'];
            document.getElementById('countAdd').textContent = counts['ADD'];
            document.getElementById('countReduce').textContent = counts['REDUCE'];
            document.getElementById('countDelete').textContent = counts['DELETE'];

            if (inflowList.innerHTML === '') inflowList.innerHTML = getEmptyStateHTML('期間無新增或加碼標的');
            if (outflowList.innerHTML === '') outflowList.innerHTML = getEmptyStateHTML('期間無刪除或減碼標的');
        }

        function createCardHTML(stock, status, diffAmount, diffPercent, currentWeight, diffWeight) {
            const config = {
                'NEW': { label: '新增', badge: 'bg-amber-500', border: 'border-amber-100', bg: 'bg-amber-50/30 hover:bg-amber-50', text: 'text-amber-700', wtText: 'text-amber-600' },
                'ADD': { label: '加碼', badge: 'bg-red-500', border: 'border-red-100', bg: 'bg-red-50/30 hover:bg-red-50', text: 'text-red-600', wtText: 'text-red-500' },
                'REDUCE': { label: '減碼', badge: 'bg-green-600', border: 'border-green-100', bg: 'bg-green-50/30 hover:bg-green-50', text: 'text-green-700', wtText: 'text-green-600' },
                'DELETE': { label: '刪除', badge: 'bg-slate-500', border: 'border-slate-200', bg: 'bg-slate-50/50 hover:bg-slate-100', text: 'text-slate-600', wtText: 'text-slate-500' }
            }[status];

            const sign = diffAmount > 0 ? '+' : '';
            const percentStr = diffPercent % 1 === 0 ? diffPercent : diffPercent.toFixed(2);
            
            return `
                <div class="flex items-center justify-between p-4 rounded-lg border ${config.border} ${config.bg} transition">
                    <div class="flex gap-4 items-center w-1/3">
                        <span class="${config.badge} text-white text-xs font-bold px-2 py-1 rounded">${config.label}</span>
                        <div>
                            <div class="font-bold text-lg">${stock.stockName}</div>
                            <div class="text-xs text-slate-500 num-font">${stock.stockId}</div>
                        </div>
                    </div>
                    <div class="w-1/3 text-center">
                        <div class="text-xs text-slate-500">持股變動 / 幅度</div>
                        <div class="font-bold ${config.text} num-font text-lg">
                            ${sign}${diffAmount.toLocaleString()} <span class="text-sm font-normal">(${sign}${percentStr}%)</span>
                        </div>
                    </div>
                    <div class="w-1/3 text-right">
                        <div class="text-xs text-slate-500">目前權重</div>
                        <div class="font-bold num-font text-lg">
                            ${currentWeight.toFixed(2)}% <span class="text-sm ${config.wtText} ml-1">${diffWeight > 0 ? '+' : ''}${diffWeight.toFixed(2)}%</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function getEmptyStateHTML(msg) {
            return `
                <div class="h-full min-h-[120px] flex items-center justify-center border-2 border-dashed border-slate-200 rounded-lg bg-slate-50/50 mt-4">
                    <span class="text-slate-400 text-sm">${msg}</span>
                </div>
            `;
        }

        initDashboard();
    </script>
</body>
</html>
